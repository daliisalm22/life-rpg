<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <title>charis - lifeRPG</title>
    </head>
    <body>
        <header class="top-control-bar">
            <div class="screen-title">
                <h1 id="header-title">DASHBOARD</h1>
            </div>
            <div class="controls-wrapper">
                <button id="light-dark-toggle" class="glass-icon-btn">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </header>

        <main class="app-container">
            <section class="glass-card status-bar">
                <div class="stat-item">
                    <span class="stat-icon"><span class="material-symbols-rounded">toll</span></span>
                    <div class="stat-info">
                        <span id="coin-count">0</span>
                        <span id="stat-label">coins</span>
                    </div>
                </div>
                <div class="stat-divider"></div>
                <div class="stat-item">
                    <span class="stat-icon"><span class="material-symbols-rounded">mode_heat</span></span>
                    <div class="stat-info">
                        <span id="coin-count">1</span>
                        <span id="stat-label">day streak</span>
                    </div>
                </div>
            </section>

            <div class="views-wrapper">
                <section id="home-screen" class="screen active">
                    <div class="glass-card">
                        <p>ur life, but gamified :3</p>
                    </div>
                </section>

                <section id="tasks-screen" class="screen">
                    <div class="glass-card task-input-card">
                        <h2>add new task</h2>
                        <form id="task-form" class="task-form">
                            <input type="text" id="task-input" placeholder="what task do you need to conquer :3" required class="glass-input">
                            <div class="task-options-row">
                                <select id="task-category" class="glass-pill-select">
                                    <option value="health">health</option>
                                    <option value="study">study</option>
                                    <option value="work">work</option>
                                    <option value="life">life</option>
                                    <option value="fun">fun</option>
                                </select>
                                <select id="task-duration" class="glass-pill-select">
                                    <option value="5">5 mins (1 coin)</option>
                                    <option value="15">15 mins (3 coins)</option>
                                    <option value="30">30 mins (6 coins)</option>
                                    <option value="60">1 hour (12 coins)</option>
                                    <option value="120">2 hours (24 coins)</option>
                                </select>
                            </div>
                            <button type="submit" class="glass-btn primary btn">add task</button>
                        </form>
                    </div>
                    <div class="glass-card task-list-card">
                        <h2>acitve tasks</h2>
                        <div id="task-list" class="task-list">
                            <p class="empty-state-text">no active tasks yet. add one above!</p>
                        </div>
                    </div>
                </section>

                <section id="shop-screen" class="screen">
                    <div class="glass-card">
                        <p>shop</p>
                    </div>
                </section>

                <section id="inventory-screen" class="screen">
                    <div class="glass-card">
                        <p>inventory</p>
                    </div>
                </section>

                <section id="settings-screen" class="screen">
                    <div class="glass-card">
                        <p>settings</p>
                    </div>
                </section>
            </div>
        </main>

        <nav class="floating-nav-bar glass-card">
            <button class="nav-icon-btn active" data-target="home-screen" title="dashboard">
                <span class="material-symbols-rounded">home</span>
            </button>
            <button class="nav-icon-btn" data-target="tasks-screen" title="tasks">
                <span class="material-symbols-rounded">check_box</span>
            </button>
            <button class="nav-icon-btn" data-target="shop-screen" title="shop">
                <span class="material-symbols-rounded">local_mall</span>
            </button>
            <button class="nav-icon-btn" data-target="inventory-screen" title="inventory">
                <span class="material-symbols-rounded">star_shine</span>
            </button>
            <button class="nav-icon-btn" data-target="settings-screen" title="settings">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </nav>

        <script src="script.js"></script>
    </body>
</html>
