<!DOCTYPE HTML>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Rounded:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
        <title>charis - lifeRPG</title>
    </head>
    <body>
        <header class="top-control-bar">
            <div class="screen-title">
                <h1 id="header-title">DASHBOARD</h1>
            </div>
            <div class="controls-wrapper">
                <button id="light-dark-toggle" class="glass-icon-btn">
                    <span class="material-symbols-rounded">dark_mode</span>
                </button>
            </div>
        </header>

        <main class="app-container">
            <section class="glass-card status-bar">
                <div class="stat-pill">🪙 <span id="coin-count">0</span> coins</div>
                <div class="stat-pill">🔥 <span id="streak-count">1</span> day streak</div>
            </section>

            <div class="views-wrapper">
                <section id="home-screen" class="screen active">
                    <div class="glass-card">
                        <p>ur life, but gamified :3</p>
                    </div>
                </section>

                <section id="tasks-screen" class="screen">
                    <div class="glass-card">
                        <p>tasks</p>
                    </div>
                </section>

                <section id="shop-screen" class="screen">
                    <div class="glass-card">
                        <p>shop</p>
                    </div>
                </section>

                <section id="settings-screen" class="screen">
                    <div class="glass-card">
                        <p>settings</p>
                    </div>
                </section>
            </div>
        </main>

        <nav class="floating-nav-bar glass-card">
            <button class="nav-icon-btn active" data-target="home-screen" title="dashboard">
                <span class="material-symbols-rounded">home</span>
            </button>
            <button class="nav-icon-btn" data-target="tasks-screen" title="tasks">
                <span class="material-symbols-rounded">check_box</span>
            </button>
            <button class="nav-icon-btn" data-target="shop-screen" title="shop">
                <span class="material-symbols-rounded">shopping_bag</span>
            </button>
            <button class="nav-icon-btn" data-target="settings-screen" title="settings">
                <span class="material-symbols-rounded">settings</span>
            </button>
        </nav>

        <script src="script.js"></script>
    </body>
</html>
